  <text x="458" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">Constitutional AI (7 rules)</text>

  <!-- Arrow 3→4 -->
  <line x1="644" y1="122" x2="658" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 04 -->
  <rect x="659" y="82" width="227" height="80" rx="7" fill="#0D1627" stroke="#1E293B" stroke-width="1"/>
  <text x="673" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
