  <text x="673" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">Prometheus · Grafana Cloud</text>
  <text x="673" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">Supabase RLS · AES-256 Vault</text>

  <!-- ── Bottom metric strip ── -->
  <!-- 19/19 Phases -->
  <rect x="14"  y="170" width="100" height="17" rx="4" fill="#14532D"/>
  <text x="64" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ 19/19 Phases</text>

  <!-- 307 Tests -->
  <rect x="122" y="170" width="95" height="17" rx="4" fill="#14532D"/>
  <text x="169" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ 307 Tests</text>

  <!-- 6 Agents -->
  <rect x="225" y="170" width="85" height="17" rx="4" fill="#1E3A5F"/>
  <text x="267" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">6 Agents</text>

  <!-- 54% cost -->
  <rect x="318" y="170" width="105" height="17" rx="4" fill="#713F12"/>
  <text x="370" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">54% Cost Saved</text>

  <!-- Sub-10ms RAG -->
  <rect x="431" y="170" width="115" height="17" rx="4" fill="#1E3A5F"/>
  <text x="488" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sub-10ms Retrieval</text>

  <!-- EU AI Act -->
  <rect x="554" y="170" width="100" height="17" rx="4" fill="#3B0764"/>
  <text x="604" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">EU AI Act Ready</text>

  <!-- Live Demo -->
  <rect x="662" y="170" width="90" height="17" rx="4" fill="#78350F"/>
  <text x="707" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">HF Spaces Live</text>
