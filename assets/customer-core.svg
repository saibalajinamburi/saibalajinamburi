  <text x="24" y="50"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="22" font-weight="800" fill="#FFFFFF">CustomerCore</text>
  <text x="24" y="68"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="11" fill="#94A3B8">Streaming Lakehouse · Autonomous LangGraph Agent Supervisor · EU AI Act Compliance</text>

  <!-- Stage boxes at y=85, each w=193 gap=10 -->

  <!-- STAGE 01 -->
  <rect x="14"  y="82" width="198" height="80" rx="7" fill="#0D1627" stroke="#1E293B" stroke-width="1"/>
  <text x="28" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="700" letter-spacing="1" fill="#38BDF8">01 STREAMING INGEST</text>
  <text x="28" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="11" font-weight="600" fill="#FFFFFF">Redpanda C++ Broker</text>
  <text x="28" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">PySpark Structured Stream</text>
  <text x="28" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">FastAPI JWT Gateway</text>

  <!-- Arrow 1→2 -->
  <line x1="214" y1="122" x2="228" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 02 -->
  <rect x="229" y="82" width="198" height="80" rx="7" fill="#0D1627" stroke="#1E293B" stroke-width="1"/>
  <text x="243" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10" font-weight="700" letter-spacing="1" fill="#06B6D4">02 AGENTIC CORE</text>
  <text x="243" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="11" font-weight="600" fill="#FFFFFF">LangGraph Supervisor</text>
  <text x="243" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
