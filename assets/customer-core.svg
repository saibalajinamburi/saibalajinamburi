<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="topBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="50%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0,6 3,0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background + top border -->
  <rect width="900" height="190" fill="url(#bg)"/>
  <rect width="900" height="2" fill="url(#topBorder)"/>

  <!-- Header -->
  <text x="24" y="26"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
