  <text x="243" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8">HITL Authorization Gate</text>

  <!-- Arrow 2→3 -->
  <line x1="429" y1="122" x2="443" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STAGE 03 -->
  <rect x="444" y="82" width="198" height="80" rx="7" fill="#0D1627" stroke="#1E293B" stroke-width="1"/>
  <text x="458" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
