<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <style>
    .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #38BDF8; text-transform: uppercase; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #F8FAFC; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; }
    .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #A78BFA; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <rect width="850" height="220" rx="12" fill="url(#ccBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="0" y="0" width="850" height="3" fill="url(#accentLine)" />

  <!-- Title & Subtitle -->
  <text x="30" y="32" class="hdr">FLAGSHIP SYSTEM // MULTI-AGENT B2B PLATFORM</text>
  <text x="30" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18px" font-weight="700" fill="#FFFFFF">CustomerCore Architecture</text>
  <text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#94A3B8">Streaming Lakehouse &amp; Autonomous LangGraph Agent Supervisor</text>

  <!-- 4 Architecture Blocks -->
  <!-- Block 1 -->
  <g transform="translate(30, 95)">
    <rect width="180" height="95" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" class="card-title">1. Event Stream</text>
    <text x="16" y="44" class="card-sub">FastAPI Ingestion</text>
    <text x="16" y="60" class="card-sub">Redpanda C++ Broker</text>
    <text x="16" y="76" class="card-sub">Async Consumer Queues</text>
  </g>

  <!-- Block 2 -->
  <g transform="translate(225, 95)">
    <rect width="180" height="95" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" class="card-title">2. Lakehouse</text>
    <text x="16" y="44" class="card-sub">PySpark Structured Stream</text>
    <text x="16" y="60" class="card-sub">Presidio PII Vault (AES-256)</text>
    <text x="16" y="76" class="card-sub">dbt Gold Analytics Marts</text>
  </g>

  <!-- Block 3 -->
  <g transform="translate(420, 95)">
    <rect width="180" height="95" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" class="card-title">3. LangGraph Network</text>
    <text x="16" y="44" class="card-sub">Supervisor Router Node</text>
    <text x="16" y="60" class="card-sub">ChromaDB + BM25 Hybrid RAG</text>
    <text x="16" y="76" class="card-sub">Human-in-the-Loop (HITL)</text>
  </g>

  <!-- Block 4 -->
  <g transform="translate(615, 95)">
    <rect width="205" height="95" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" class="card-title">4. Governance &amp; Ops</text>
    <text x="16" y="44" class="card-sub">LiteLLM SLA Router (-54% cost)</text>
    <text x="16" y="60" class="card-sub">Constitutional AI 7-Rule Safety</text>
    <text x="16" y="76" class="card-sub">Prometheus + Langfuse Tracing</text>
  </g>
</svg>
