<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="heroLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="14" fill="url(#heroLightBg)" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="0" y="0" width="900" height="3" fill="url(#accentLight)" />

  <g transform="translate(50, 45)">
    <!-- Pretitle -->
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" font-weight="700" letter-spacing="2px" fill="#0369A1" text-transform="uppercase">PORTFOLIO &amp; ENGINEERING SYSTEMS</text>

    <!-- Name -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38px" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">SAIBALAJI NAMBURI</text>

    <!-- Role -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16px" font-weight="600" fill="#3730A3">AI Systems Engineer <tspan fill="#94A3B8">|</tspan> LLMs · RAG · Agents · LLMOps</text>

    <!-- Subtext -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" fill="#475569">M.Sc. International Data Analytics — University of Hildesheim, Germany 🇩🇪</text>
  </g>

  <!-- Right Side Accent Badge -->
  <g transform="translate(680, 55)">
    <rect width="170" height="85" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
    <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="700" letter-spacing="1px" fill="#0284C7" text-anchor="middle">AVAILABILITY</text>
    <text x="85" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" font-weight="600" fill="#0F172A" text-anchor="middle">Werkstudent / Intern</text>
    <text x="85" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" fill="#059669" text-anchor="middle">● Open to Roles</text>
  </g>
</svg>
