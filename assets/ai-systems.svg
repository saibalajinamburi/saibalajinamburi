<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="topBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="50%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="rootBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="midBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E4F65"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" fill="url(#bg)"/>
  <!-- Top accent border -->
  <rect width="900" height="2" fill="url(#topBorder)"/>

  <!-- ── ROW 1: Root node ── -->
  <!-- Box centered at x=320, width=260 -->
  <rect x="320" y="30" width="260" height="44" rx="8"
        fill="url(#rootBox)" stroke="#6366F1" stroke-width="1.5"/>
  <text x="450" y="57"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="1">AI SYSTEMS ENGINEER</text>

  <!-- ── Connector: root → 3 second-row boxes ── -->
  <!-- Vertical stem from root bottom -->
  <line x1="450" y1="74" x2="450" y2="96" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Horizontal bar -->
  <line x1="140" y1="96" x2="760" y2="96" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Three drops -->
  <line x1="140" y1="96"  x2="140" y2="115" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="450" y1="96"  x2="450" y2="115" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="96"  x2="760" y2="115" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ── ROW 2: LLMs | RAG | AGENTS ── -->
  <!-- LLMs (x=50) -->
  <rect x="50" y="115" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="140" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLMs</text>
  <text x="140" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">Routing · Cascades · Inference</text>

  <!-- RAG (x=360) -->
  <rect x="360" y="115" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="450" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">RAG</text>
  <text x="450" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">Hybrid Search · Fusion · Cache</text>

  <!-- AGENTS (x=670) -->
  <rect x="670" y="115" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="760" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AGENTS</text>
  <text x="760" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">State Graphs · HITL · Tools</text>

  <!-- ── Connector: 3 boxes → middle node ── -->
  <line x1="140" y1="170" x2="140" y2="192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="450" y1="170" x2="450" y2="192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="170" x2="760" y2="192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="140" y1="192" x2="760" y2="192" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="450" y1="192" x2="450" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ── ROW 3: AI APPLICATIONS ── -->
  <rect x="330" y="210" width="240" height="42" rx="7"
        fill="url(#midBox)" stroke="#0891B2" stroke-width="1.2"/>
  <text x="450" y="236"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"
        letter-spacing="0.5">AI APPLICATIONS</text>

  <!-- ── Connector: mid → 3 bottom boxes ── -->
  <line x1="450" y1="252" x2="450" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="140" y1="270" x2="760" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="140" y1="270" x2="140" y2="288" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="450" y1="270" x2="450" y2="288" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="760" y1="270" x2="760" y2="288" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ── ROW 4: DATA SYSTEMS | EVAL & SAFETY | LLMOPS ── -->
  <!-- DATA SYSTEMS -->
  <rect x="50" y="288" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="140" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DATA SYSTEMS</text>
  <text x="140" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">Stream · Lakehouse · Stores</text>

  <!-- EVAL & SAFETY -->
  <rect x="360" y="288" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="450" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">EVAL &amp; SAFETY</text>
  <text x="450" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">Testing · Guardrails · Audit</text>

  <!-- LLMOPS -->
  <rect x="670" y="288" width="180" height="55" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="760" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLMOps</text>
  <text x="760" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="10.5" fill="#94A3B8" text-anchor="middle">Trace · Deploy · Cost Control</text>

  <!-- ── Philosophy tagline ── -->
  <text x="450" y="368"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" font-style="italic" font-weight="500" fill="#38BDF8" text-anchor="middle">
    "Models are components. Systems are products."
  </text>
</svg>
